<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>16 抛 12 正 · v6 视觉样片</title><style>
@font-face{font-family:FilmSans;src:url('../long/fonts/NotoSansSC-VF.ttf');font-weight:100 900;font-display:block}
@font-face{font-family:FilmSerif;src:url('../long/fonts/NotoSerifSC-VF.ttf');font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#16203a;color:#16203a;font-family:FilmSans}
#stage{display:block;width:100vw;height:100vh;object-fit:contain}
#controls{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(860px,92vw);background:#f7f2e4ee;border:1px solid #16203a55;border-radius:4px;padding:10px 18px;display:flex;align-items:center;gap:14px;transition:opacity .3s}
button{font:600 14px FilmSans;background:#d63f29;border:0;padding:7px 16px;cursor:pointer;color:#f7f2e4}
input{flex:1;accent-color:#d63f29}#clock{font:13px FilmSans;min-width:92px}
body.export #controls{display:none}
</style></head><body><canvas id="stage" width="1920" height="1080"></canvas>
<div id="controls"><button id="toggle">播放</button><input id="seek" type="range" min="0" max="24" step="0.01" value="0"><span id="clock">0.00 / 24.00 s</span></div>
<script type="module" src="film.js"></script></body></html>
