<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随机汇聚成规律 | Concept Motion Lab</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070c16;color:#f3eee5;font-family:"Microsoft YaHei",sans-serif}
    #stage{display:block;width:100vw;height:100vh;object-fit:contain}
    #controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;width:min(800px,88vw);padding:12px 18px;border:1px solid #ffffff25;background:#09111edc;backdrop-filter:blur(10px);border-radius:12px;font-size:13px}
    #controls button{background:#f4aa77;color:#09111e;border:0;border-radius:6px;padding:8px 13px;cursor:pointer;font-weight:bold}
    #seek{flex:1;accent-color:#f4aa77} #clock{font-variant-numeric:tabular-nums;min-width:85px}
    body.export #controls{display:none}
  </style>
</head>
<body>
  <canvas id="stage" width="1920" height="1080" aria-label="随机汇聚成规律动画"></canvas>
  <div id="controls"><button id="toggle">播放</button><input id="seek" type="range" min="0" max="45" step="0.01" value="0"><span id="clock">00:00 / 00:45</span><audio id="audio" preload="auto" src="out/soundtrack.wav"></audio></div>
  <script type="module" src="src/visual.js"></script>
</body>
</html>
